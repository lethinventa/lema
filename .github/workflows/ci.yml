name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: apps/web

jobs:
  test:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Same script a developer runs locally (scripts/dev-setup.sh) — starts
      # the local Supabase stack (Postgres + Auth) via the Supabase CLI and
      # pushes the Drizzle schema, so CI exercises tests against the same
      # kind of real Postgres/Supabase instance as local dev, not a mock.
      - name: Start local Supabase stack and push schema
        run: pnpm dev:setup

      - name: Run unit and route tests
        run: pnpm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Stop local Supabase stack
        if: always()
        continue-on-error: true
        run: pnpm dev:teardown
